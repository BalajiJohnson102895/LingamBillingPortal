<h2 mat-dialog-title>{{data ? 'Edit Product' : 'Add Product'}}</h2>

<div mat-dialog-content [formGroup]="productForm" class="dialog-body">

    <mat-form-field appearance="outline">
        <mat-label>Product Code</mat-label>
        <input matInput formControlName="productCode">
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Description</mat-label>
        <input matInput formControlName="productDescription">
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Price ₹</mat-label>
        <input matInput type="number" formControlName="priceInclGST">
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>GST %</mat-label>
        <input matInput type="number" formControlName="gstPercent">
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Case Quantity</mat-label>
        <input matInput type="number" formControlName="caseQuantity">
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>HSN Code</mat-label>
        <input matInput formControlName="hsnCode">
    </mat-form-field>

</div>

<div mat-dialog-actions class="dialog-actions">
    <button mat-raised-button class="save-btn" (click)="saveProduct()">
        {{data ? 'Update Product' : 'Add Product'}}
    </button>

    <button mat-raised-button (click)="cancelDialog()">Cancel</button>
</div>
