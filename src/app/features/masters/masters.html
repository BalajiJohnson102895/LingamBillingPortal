<mat-tab-group>
  <mat-tab label="Product Master">
    <div class="master-page">

      <div class="master-header">
        <h2>Product Master</h2>
        <div class="header-actions">
          <input type="text" placeholder="Search product..."
            [(ngModel)]="searchText"
            (input)="onSearch()">

          <button mat-raised-button class="add-btn" (click)="openProductDialog()">
            Add Product
          </button>
        </div>
      </div>

      <!-- ✅ table-container controls the scroll, not the whole page -->
      <div class="table-container">
        <table mat-table [dataSource]="dataSource" matSort class="master-table">

          <ng-container matColumnDef="productCode">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Code</th>
            <td mat-cell *matCellDef="let p">{{ p.productCode }}</td>
          </ng-container>

          <ng-container matColumnDef="productDescription">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
            <td mat-cell *matCellDef="let p">{{ p.productDescription }}</td>
          </ng-container>

          <ng-container matColumnDef="priceInclGST">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Purchase Price ₹</th>
            <td mat-cell *matCellDef="let p">{{ p.priceInclGST }}</td>
          </ng-container>

          <ng-container matColumnDef="gstPercent">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>GST %</th>
            <td mat-cell *matCellDef="let p">{{ p.gstPercent }}</td>
          </ng-container>

          <ng-container matColumnDef="caseQuantity">
            <th mat-header-cell *matHeaderCellDef>Case Qty</th>
            <td mat-cell *matCellDef="let p">{{ p.caseQuantity }}</td>
          </ng-container>

          <ng-container matColumnDef="hsnCode">
            <th mat-header-cell *matHeaderCellDef>HSN Code</th>
            <td mat-cell *matCellDef="let p">{{ p.hsnCode }}</td>
          </ng-container>

          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef>Action</th>
            <td mat-cell *matCellDef="let p" class="action-cell">
              <button mat-icon-button (click)="openProductDialog(p)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button (click)="deleteProduct(p.productId)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <!-- ✅ sticky: true makes the header stay while tbody scrolls -->
          <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell no-data" colspan="7">No products found.</td>
          </tr>

        </table>
      </div>

    </div>
  </mat-tab>
  <mat-tab label="Customer Master"></mat-tab>
  <mat-tab label="Fleet Master"></mat-tab>
</mat-tab-group>
